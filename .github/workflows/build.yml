name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # On a version tag, create the draft release once, up front. Both builds then
  # upload into it; if each created its own, they'd race and split into two drafts.
  release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Reuse an existing release for this tag (e.g. on a re-run).
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            cat > notes.md <<'NOTES'
          ### Install
          **Windows**
          - **Most PCs (Intel/AMD):** download `Tunelet_*_x64-setup.exe`
          - **Snapdragon / ARM PCs:** download `Tunelet_*_arm64-setup.exe`

          Windows may say "Windows protected your PC" because the app isn't code-signed. Click **More info → Run anyway**.

          **Mac (beta)**: macOS 11 or newer, Apple Silicon or Intel
          - Download `Tunelet_*_universal.dmg` and drag Tunelet into Applications.
          - The first time, macOS blocks it because it isn't signed with a paid Apple developer account: on macOS 15+ go to **System Settings → Privacy & Security → Open Anyway**; on older versions right-click Tunelet → **Open**.

          New to Tunelet? Follow the [setup guide](https://github.com/ShadowMonarch9099/tunelet/blob/main/docs/setup-guide.md) (download, Spotify Client ID, connecting).
          NOTES
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="Tunelet $TAG" -F draft=true -F body=@notes.md --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: release
    # Run on every push; the release job is skipped (not failed) on non-tag pushes.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            arch: windows-x64
            rust-targets: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          - name: Windows arm64
            os: windows-latest
            arch: windows-arm64
            rust-targets: aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
            # WiX (.msi) can't target ARM64, so ARM64 ships the .exe installer only.
            args: "--target aarch64-pc-windows-msvc --bundles nsis"
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            arch: macos-universal
            # One universal app that runs natively on both kinds of Mac.
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - run: npm ci

      # On a version tag: builds signed installers and uploads them (with their
      # .sig files) into the draft release. latest.json is written once by the
      # updater-json job below, so the two builds can't overwrite each other's entry.
      # On other pushes: just builds.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.id }}
          uploadUpdaterJson: false

      - uses: actions/upload-artifact@v4
        with:
          name: tunelet-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  # Build latest.json for the in-app updater from all builds' signatures.
  updater-json:
    name: Write latest.json
    needs: [release, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.id }}
          TAG: ${{ github.ref_name }}
        run: |
          api="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          gh api "$api/assets?per_page=100" > assets.json
          mkdir sigs
          jq -r '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' assets.json |
            while read -r id name; do
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "sigs/$name"
            done
          node - <<'JS'
          const fs = require("fs");
          const { TAG, GITHUB_REPOSITORY } = process.env;
          const base = `https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/`;
          const entry = (file) => {
            const sig = `sigs/${file}.sig`;
            return file && fs.existsSync(sig) ? { signature: fs.readFileSync(sig, "utf8").trim(), url: base + encodeURIComponent(file) } : null;
          };
          const assets = JSON.parse(fs.readFileSync("assets.json", "utf8")).map((a) => a.name);
          const v = TAG.replace(/^v/, "");
          const x64 = entry(`Tunelet_${v}_x64-setup.exe`);
          const x64msi = entry(`Tunelet_${v}_x64_en-US.msi`);
          const arm = entry(`Tunelet_${v}_arm64-setup.exe`);
          // macOS update bundle (one universal app for both kinds of Mac).
          const mac = entry(assets.find((n) => n.endsWith(".app.tar.gz")));
          if (!x64 || !arm || !mac) { console.error("missing an installer signature", { x64: !!x64, arm: !!arm, mac: !!mac }); process.exit(1); }
          const platforms = {
            "windows-x86_64": x64, "windows-x86_64-nsis": x64,
            "windows-aarch64": arm, "windows-aarch64-nsis": arm,
            "darwin-aarch64": mac, "darwin-x86_64": mac, "darwin-universal": mac,
          };
          if (x64msi) platforms["windows-x86_64-msi"] = x64msi;
          fs.writeFileSync("latest.json", JSON.stringify({ version: v, notes: "", pub_date: new Date().toISOString(), platforms }, null, 2));
          console.log(Object.keys(platforms).join(" "));
          JS
          old=$(jq -r '.[] | select(.name=="latest.json") | .id' assets.json)
          [ -n "$old" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          gh api -X POST "https://uploads.github.com/$api/assets?name=latest.json"             -H "Content-Type: application/json" --input latest.json --jq .browser_download_url
