name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          - arch: arm64
            target: aarch64-pc-windows-msvc
            # WiX (.msi) can't target ARM64, so ARM64 ships the .exe installer only.
            args: "--target aarch64-pc-windows-msvc --bundles nsis"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - run: npm ci

      # On a version tag (v*): builds signed installers + latest.json (for the
      # in-app updater) and attaches them to a draft GitHub Release.
      # On other pushes: just builds.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "Tunelet ${{ github.ref_name }}"
          releaseBody: |
            ### Install
            - **Most PCs (Intel/AMD):** download `Tunelet_*_x64-setup.exe`
            - **Snapdragon / ARM PCs:** download `Tunelet_*_arm64-setup.exe`

            Windows may say "Windows protected your PC" because the app isn't code-signed. Click **More info → Run anyway**.
            After installing, open Settings in Tunelet to turn on **Start with Windows**.
          releaseDraft: true
          updaterJsonPreferNsis: true

      - uses: actions/upload-artifact@v4
        with:
          name: tunelet-windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
